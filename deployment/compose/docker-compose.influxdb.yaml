# docker-compose.yml
version: "3.8"

services:
  influxdb3-core:
    image: influxdb:3-core
    container_name: influxdb3-core
    command: >
      influxdb3 serve
      --node-id node-0
      --http-bind 0.0.0.0:8181
      --object-store file
      --data-dir=/var/lib/influxdb3/data
      --log-filter info
    ports:
      - "8181:8181"
    volumes:
      - ./influxdb3-data:/var/lib/influxdb3/data